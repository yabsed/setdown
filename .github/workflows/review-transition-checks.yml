name: Review transition checks

on:
  pull_request:
    paths:
      - 'apps/desktop/src/renderer/project/**'
      - 'apps/desktop/test/e2e/review-transition*'
      - '.github/workflows/review-transition-checks.yml'

permissions:
  contents: read

concurrency:
  group: review-transition-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - id: install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/electron/install.js
      - name: TypeScript and Svelte
        run: npm run typecheck
      - name: Review regressions
        working-directory: apps/desktop
        run: >
          npm test -- src/renderer/project/source-control/git-review-transition.test.ts
          src/renderer/project/source-control/review-transition.test.ts
          src/renderer/project/source-control/git-review-latency.test.ts
          src/renderer/project/source-control/git-review-viewport.test.ts
          src/renderer/project/source-control/git-review-freshness.test.ts
          src/renderer/project/source-control/review-presentation.test.ts --maxWorkers=2
      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Native Electron and Monaco handoff
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: apps/desktop
        run: xvfb-run -a npx playwright test test/e2e/review-transition.spec.ts --workers=1 --trace=retain-on-failure
      - name: Full unit suite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test -- --maxWorkers=2
      - uses: actions/upload-artifact@v4
        if: ${{ failure() && !cancelled() }}
        with:
          name: review-transition-failure
          path: apps/desktop/test-results
          retention-days: 7
