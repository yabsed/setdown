name: Review handoff checks
on:
  pull_request:
    paths:
      - 'apps/desktop/src/renderer/**'
      - 'apps/desktop/test/e2e/review-handoff*'
      - '.github/workflows/review-handoff-checks.yml'
permissions:
  contents: read
concurrency:
  group: review-handoff-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Tracked source only; no .git, credentials or installed dependencies.
      - run: git archive --format=tar HEAD > review-handoff-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: review-handoff-source
          path: review-handoff-source.tar
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - id: install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/electron/install.js
      - name: Project TypeScript and Svelte checks
        run: npm run typecheck
      - name: Full unit suite
        working-directory: apps/desktop
        run: npm test -- --maxWorkers=2
      - name: Production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
