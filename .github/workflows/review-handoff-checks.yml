name: Review handoff checks
on:
  pull_request:
    paths:
      - 'apps/desktop/src/renderer/**'
      - 'apps/desktop/test/e2e/review-handoff*'
      - '.github/workflows/review-handoff-checks.yml'
permissions:
  contents: read
concurrency:
  group: review-handoff-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - id: install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/electron/install.js
      - name: Project TypeScript and Svelte checks
        run: npm run typecheck
      - name: Handoff and source-input regression tests
        working-directory: apps/desktop
        run: npm test -- src/renderer/project/source-control/git-review-handoff.test.ts src/renderer/project/source-control/review-source-interactions.test.ts
      - name: Full unit suite
        working-directory: apps/desktop
        run: npm test -- --maxWorkers=2
      - name: Production build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - name: Native Electron retained-editor handoff
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: apps/desktop
        run: xvfb-run --auto-servernum npx --no-install playwright test test/e2e/review-handoff.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: review-handoff-test-results
          path: apps/desktop/test-results
          retention-days: 7
