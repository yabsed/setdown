name: Release

on:
  push:
    tags: ['v*']
  # Manual runs build downloadable artifacts without publishing a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release version
        id: version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { version } = JSON.parse(fs.readFileSync('apps/desktop/package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (lock.packages['apps/desktop'].version !== version) {
            throw new Error('Update package-lock.json along with the desktop version.');
          }
          if (process.env.GITHUB_EVENT_NAME === 'push' && process.env.GITHUB_REF !== `refs/tags/v${version}`) {
            throw new Error(`Release tag must be v${version}, matching apps/desktop/package.json.`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nprerelease=${version.includes('-')}\n`);
          NODE

  build:
    needs: metadata
    name: Package ${{ matrix.platform }} x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            runner: windows-2022
          - platform: linux
            runner: ubuntu-22.04
    env:
      # Initial Windows releases are unsigned; signing can be configured later.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm libcrypt1
      - run: npm ci
      - name: Run unit tests
        if: runner.os == 'Linux'
        run: npm test
      # Each OS rebuilds native modules for its own Electron runtime.
      # Publishing happens only in the release job after both builds succeed.
      - name: Build installers
        run: npm run package:${{ matrix.platform }} -- --x64 --publish never
      - name: Verify expected installers
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { RELEASE_VERSION: version, RELEASE_PLATFORM: platform } = process.env;
          const suffixes = platform === 'win' ? ['x64.exe'] : ['x86_64.AppImage', 'amd64.deb', 'x86_64.rpm'];
          for (const suffix of suffixes) {
            const file = `apps/desktop/release/Setdown-${version}-${platform}-${suffix}`;
            const stat = fs.statSync(file);
            if (!stat.isFile() || stat.size === 0) throw new Error(`Missing or empty installer: ${file}`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-assets
      - name: Publish installers and checksums
        working-directory: release-assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          files=(
            "Setdown-${RELEASE_VERSION}-win-x64.exe"
            "Setdown-${RELEASE_VERSION}-linux-x86_64.AppImage"
            "Setdown-${RELEASE_VERSION}-linux-amd64.deb"
            "Setdown-${RELEASE_VERSION}-linux-x86_64.rpm"
          )
          for file in "${files[@]}"; do test -s "$file"; done
          sha256sum "${files[@]}" > SHA256SUMS
          flags=()
          if [[ "$PRERELEASE" == 'true' ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "${files[@]}" SHA256SUMS \
            --verify-tag --generate-notes --title "Setdown ${RELEASE_VERSION}" "${flags[@]}"
