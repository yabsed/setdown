name: Package and release

on:
  # Only the checked desktop pipeline calls this workflow.
  workflow_call:
    inputs:
      channel:
        required: true
        type: string

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - id: metadata
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: node scripts/ci/release-metadata.mjs

  build:
    needs: metadata
    name: Package ${{ matrix.platform }} x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            runner: windows-2022
          - platform: linux
            runner: ubuntu-22.04
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install Linux packaging and display tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm libcrypt1 xvfb xauth dbus-x11
      - run: npm ci
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      # Version changes are confined to the package; no version-bump commit.
      - name: Build installers
        run: npm run package:$RELEASE_PLATFORM -- --x64 --publish never --config.extraMetadata.version="$RELEASE_VERSION"
      - name: Verify expected installers
        run: node scripts/ci/verify-installers.mjs
      - name: Enable packaged Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root apps/desktop/release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 apps/desktop/release/linux-unpacked/chrome-sandbox
      - name: Launch packaged Linux app on an isolated display
        if: runner.os == 'Linux'
        run: bash apps/desktop/scripts/with-isolated-display.sh node scripts/ci/package-smoke.mjs
      # Hosted Windows runners have a dedicated desktop, separate from users.
      - name: Launch packaged Windows app
        if: runner.os == 'Windows'
        run: node scripts/ci/package-smoke.mjs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: package-failure-${{ matrix.platform }}-${{ github.run_attempt }}
          path: |
            apps/desktop/test-results/package-smoke
            apps/desktop/release/builder-debug.yml
            apps/desktop/release/builder-effective-config.yaml
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.platform }}-x64-${{ github.run_attempt }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/build-info-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish complete release
    if: inputs.channel != 'artifact' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      # Failed-job reruns may reuse the successful platform's earlier artifact.
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: release-artifacts
      - name: Publish installers, provenance and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: node scripts/ci/publish-release.mjs
