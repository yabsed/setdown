name: Desktop pipeline

on:
  workflow_call:
    inputs:
      channel:
        description: none (PR), preview (main), tag, or artifact (manual)
        required: true
        type: string

permissions:
  contents: read

# Documentation-only pushes never enter this workflow and cannot cancel an
# app build. Tags and manual runs each get their own uninterrupted run.
concurrency:
  group: desktop-${{ github.event_name }}-${{ github.ref }}-${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && github.run_id || 'latest' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Includes every focused contract unit test without running it twice.
      - run: npm test
      - run: node --test apps/desktop/scripts/preview-benchmark.test.mjs

  contract:
    name: preview-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Enable the installed Electron sandbox
        run: node scripts/ci/electron-sandbox.mjs .
      - name: Typecheck and build
        run: npm run build
      - name: Real Electron contract tests on an isolated display
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: npm run test:preview-contract:e2e --workspace @setdown/desktop -- --reporter=line,html --trace=retain-on-failure
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: preview-contract-failure-${{ github.run_attempt }}
          path: |
            apps/desktop/test-results
            apps/desktop/playwright-report
          retention-days: 14

  installers:
    name: Installers
    needs: [unit, contract]
    if: inputs.channel != 'none' && github.event_name != 'pull_request'
    uses: ./.github/workflows/release.yml
    with:
      channel: ${{ inputs.channel }}
    permissions:
      contents: write
