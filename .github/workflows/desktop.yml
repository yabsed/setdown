name: Desktop build and release

on:
  workflow_call:
    inputs:
      channel:
        description: none (PR/main build), tag, or artifact (manual)
        required: true
        type: string

permissions:
  contents: read

# Documentation-only pushes never enter this workflow and cannot cancel an
# app build. Tags and manual runs each get their own uninterrupted run.
concurrency:
  group: desktop-${{ github.event_name }}-${{ github.ref }}-${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && github.run_id || 'latest' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: Tests, typecheck and build
    if: inputs.channel == 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare pinned Zed language host
        run: |
          git submodule update --init --depth 1 -- vendor/zed
          rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/language-host
          key: language-host-${{ runner.os }}-${{ hashFiles('tooling/language-host/Cargo.lock', 'tooling/language-host/Cargo.toml') }}
      # npm's cache does not include Electron's lazily downloaded binary.
      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install Electron before tests
        working-directory: apps/desktop
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
        run: npx --no-install install-electron
      - name: Install native tools used by service tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential clang clangd cmake meson ninja-build pkg-config libfontconfig1-dev libasound2-dev libxkbcommon-dev libwayland-dev libudev-dev libssl-dev
      - name: Unit tests and architecture boundaries
        run: npm test
      # Tooling tests read the pinned sources before the build initializes them.
      - name: Initialize Dark Reader for tooling tests
        run: git submodule update --init -- vendor/darkreader
      - name: CI policy, test inventory and build adapters
        run: npm run test:tooling
      - run: npm run build

  installers:
    name: Installers
    if: (inputs.channel == 'tag' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (inputs.channel == 'artifact' && github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/release.yml
    with:
      channel: ${{ inputs.channel }}
    permissions:
      contents: write
