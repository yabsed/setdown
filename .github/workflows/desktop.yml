name: Desktop build and release

on:
  workflow_call:
    inputs:
      channel:
        description: none (PR/main build), tag, or artifact (manual)
        required: true
        type: string

permissions:
  contents: read

# Documentation-only pushes never enter this workflow and cannot cancel an
# app build. Tags and manual runs each get their own uninterrupted run.
concurrency:
  group: desktop-${{ github.event_name }}-${{ github.ref }}-${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && github.run_id || 'latest' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: Typecheck and build
    if: inputs.channel == 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  installers:
    name: Installers
    if: (inputs.channel == 'tag' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (inputs.channel == 'artifact' && github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/release.yml
    with:
      channel: ${{ inputs.channel }}
    permissions:
      contents: write
