<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
<title id="title">현재 셀 카드 구조와 제안하는 읽기 구조</title><desc id="description">현재는 Markdown과 코드가 같은 상자에 들어 있고 코드와 결과 사이에 조작 줄들이 있다. 제안에서는 문서 본문, 코드, 표가 역할에 따라 구분되고 코드와 결과가 가까이 연결된다.</desc>
<g font-family="NanumGothic, Noto Sans CJK KR, sans-serif"><rect x="0" y="0" width="1200" height="680" rx="0" fill="#ffffff" stroke="none"/><text x="30" y="38" font-size="25" fill="#182536" font-weight="bold">셀의 경계와 읽을 내용의 관계를 다르게 표현한다</text><text x="30" y="66" font-size="15" fill="#526172" font-weight="normal">구조 비교를 위한 개념도 · 실제 개선 화면이나 사용성 검증 결과가 아님</text><text x="30" y="111" font-size="19" fill="#182536" font-weight="bold">현재: 셀마다 같은 상자와 조작 줄</text><text x="640" y="111" font-size="19" fill="#182536" font-weight="bold">제안: 설명 → 코드 → 결과의 연결</text><rect x="30" y="135" width="530" height="150" rx="5" fill="#f5f6f8" stroke="#a4aeb9"/><rect x="31" y="136" width="528" height="34" rx="0" fill="#e3e7ed" stroke="none"/><rect x="30" y="306" width="530" height="311" rx="5" fill="#f5f6f8" stroke="#a4aeb9"/><rect x="31" y="307" width="528" height="34" rx="0" fill="#e3e7ed" stroke="none"/><text x="47" y="159" font-size="15" fill="#4c5968" font-weight="normal">⠿   Md   Markdown   Edit</text><text x="52" y="207" font-size="22" fill="#182536" font-weight="bold">설명 제목</text><text x="52" y="243" font-size="16" fill="#182536" font-weight="normal">본문도 코드와 같은 글꼴·같은 카드</text><text x="47" y="330" font-size="15" fill="#4c5968" font-weight="normal">⠿   [33]   Code   Run</text><text x="52" y="377" font-size="17" fill="#182536" font-weight="normal">evaluation_table = ...</text><text x="52" y="407" font-size="17" fill="#182536" font-weight="normal">evaluation_table.round(3)</text><rect x="31" y="431" width="528" height="26" rx="0" fill="#e3e7ed" stroke="none"/><text x="47" y="449" font-size="14" fill="#4c5968" font-weight="normal">Output   Collapse</text><rect x="31" y="458" width="528" height="24" rx="0" fill="#e3e7ed" stroke="none"/><text x="47" y="476" font-size="14" fill="#4c5968" font-weight="normal">Copy output</text><rect x="31" y="485" width="528" height="26" rx="0" fill="#e3e7ed" stroke="none"/><text x="47" y="503" font-size="14" fill="#4c5968" font-weight="normal">Rich output ▾</text><text x="53" y="552" font-size="15" fill="#182536" font-weight="bold">Model</text><text x="350" y="552" font-size="15" fill="#182536" font-weight="bold">Test RMSE</text><text x="53" y="581" font-size="15" fill="#182536" font-weight="normal">Two-line</text><text x="383" y="581" font-size="15" fill="#182536" font-weight="normal">2.117</text><text x="676" y="166" font-size="24" fill="#182536" font-weight="bold">설명 제목</text><text x="676" y="203" font-size="17" fill="#182536" font-weight="normal">문서 본문은 읽기 좋은 폭으로 흐르고,</text><text x="676" y="232" font-size="17" fill="#182536" font-weight="normal">코드·표는 필요한 너비를 사용한다.</text><rect x="674" y="272" width="496" height="130" rx="5" fill="#f1f4f7" stroke="#ccd4dd"/><text x="645" y="301" font-size="21" fill="#344455" font-weight="normal">▷</text><text x="637" y="390" font-size="13" fill="#526172" font-weight="normal">[33]</text><text x="694" y="310" font-size="17" fill="#182536" font-weight="normal">evaluation_table = ...</text><text x="694" y="341" font-size="17" fill="#182536" font-weight="normal">evaluation_table.round(3)</text><text x="694" y="384" font-size="13" fill="#526172" font-weight="normal">실행 상태 · 필요할 때 확인하는 조작</text><rect x="685" y="420" width="470" height="32" rx="0" fill="#e3e7ed" stroke="none"/><text x="699" y="442" font-size="15" fill="#182536" font-weight="bold">Model</text><text x="1020" y="442" font-size="15" fill="#182536" font-weight="bold">Test RMSE</text><text x="699" y="477" font-size="15" fill="#182536" font-weight="normal">Two-line</text><text x="1060" y="477" font-size="15" fill="#182536" font-weight="normal">2.117</text><text x="699" y="511" font-size="15" fill="#182536" font-weight="normal">Affine</text><text x="1060" y="511" font-size="15" fill="#182536" font-weight="normal">3.880</text><text x="676" y="581" font-size="21" fill="#182536" font-weight="bold">다음 해석으로 이어진다</text><text x="30" y="654" font-size="16" fill="#526172" font-weight="normal">핵심 상태는 계속 보인다. 편집·선택·실행 상태의 표현과 키보드 조작은 유지한다.</text></g></svg>