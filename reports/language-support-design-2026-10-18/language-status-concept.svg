  <circle cx="936" cy="144" r="3" fill="#6c6c67"/>
  <text x="948" y="149" class="small">TypeScript · Project analysis</text>
  <path d="m1245 141 4 5 4-5" fill="none" stroke="#6c6c67"/>
  <text x="1286" y="149" class="small muted">100%  +</text>
  <text x="84" y="212" class="small muted">1</text>
  <text x="119" y="212" class="code"><tspan fill="#9a4383">import</tspan> { beforeEach, expect, test, vi } <tspan fill="#9a4383">from</tspan> <tspan fill="#246d43">'vitest'</tspan>;</text>
  <text x="84" y="246" class="small muted">2</text>
  <text x="119" y="246" class="code"><tspan fill="#9a4383">import</tspan> { ExplorerClipboard } <tspan fill="#9a4383">from</tspan> <tspan fill="#246d43">'./explorer-clipboard'</tspan>;</text>
  <text x="84" y="280" class="small muted">3</text>
  <text x="84" y="314" class="small muted">4</text>
  <text x="119" y="314" class="code"><tspan fill="#0969da">test</tspan>(<tspan fill="#246d43">'copies the selected entry'</tspan>, () =&gt; {</text>
  <text x="84" y="348" class="small muted">5</text>
  <text x="119" y="348" class="code">  <tspan fill="#6c6c67">// The project service resolves real files and dependencies.</tspan></text>
  <text x="84" y="382" class="small muted">6</text>
  <text x="119" y="382" class="code">});</text>
  <text x="56" y="457" class="label">A · PROJECT ANALYSIS AVAILABLE</text>
  <text x="752" y="457" class="label">B · LIMITED ANALYSIS</text>
