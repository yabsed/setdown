<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc">
  <title id="title">Setdown language support design proposal</title>
  <desc id="desc">An active document status in the existing location bar opens a panel showing analysis scope, project configuration, TypeScript version and providers. A second panel illustrates limited syntax analysis with a setup action. This is a design concept, not a running product screenshot.</desc>
  <defs>
    <style>
      text { font-family: 'D2Coding', 'DejaVu Sans Mono', monospace; fill: #242424; font-size: 16px; }
      .muted { fill: #6c6c67; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; }
      .heading { font-size: 22px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 700; }
      .link { fill: #0969da; }
      .code { font-size: 18px; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#242424" flood-opacity="0.07"/></filter>
  </defs>
  <rect width="1440" height="1060" fill="#f7f7f5"/>
  <text x="56" y="57" class="heading">Language support belongs to the active document</text>
  <text x="56" y="86" class="muted">Setdown design proposal · Existing location bar · No additional permanent bottom bar</text>
