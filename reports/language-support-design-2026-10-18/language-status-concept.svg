  <text x="56" y="999" class="small muted">Concept only. Values illustrate the proposed model; bundled TypeScript and provider roles require implementation.</text>
  <text x="56" y="1024" class="small muted">Limited syntax mode assumes the URI / TSX parser defect has been fixed. An unverified parser must not publish errors.</text>
