[package]
name = "setdown-language-host"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace]
resolver = "2"

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
smol = "2"
collections = { path = "../../vendor/zed/crates/collections" }
extension = { path = "../../vendor/zed/crates/extension" }
extension_host = { path = "../../vendor/zed/crates/extension_host" }
fs = { path = "../../vendor/zed/crates/fs" }
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false }
gpui_platform = { path = "../../vendor/zed/crates/gpui_platform", default-features = false }
gpui_tokio = { path = "../../vendor/zed/crates/gpui_tokio" }
http_client = { path = "../../vendor/zed/crates/http_client" }
language = { path = "../../vendor/zed/crates/language" }
language_extension = { path = "../../vendor/zed/crates/language_extension" }
languages = { path = "../../vendor/zed/crates/languages" }
lsp = { path = "../../vendor/zed/crates/lsp" }
node_runtime = { path = "../../vendor/zed/crates/node_runtime" }
paths = { path = "../../vendor/zed/crates/paths" }
project = { path = "../../vendor/zed/crates/project" }
release_channel = { path = "../../vendor/zed/crates/release_channel" }
reqwest_client = { path = "../../vendor/zed/crates/reqwest_client" }
settings = { path = "../../vendor/zed/crates/settings" }
util = { path = "../../vendor/zed/crates/util", features = ["debug-embed"] }
watch = { path = "../../vendor/zed/crates/watch" }
which = "8"
tree-sitter = { git = "https://github.com/tree-sitter/tree-sitter", rev = "803c6ebaac27d69e1808b45058482e868d073ceb" }
streaming-iterator = "0.1"
toml = { version = "0.9", default-features = false, features = ["std", "serde", "parse"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
lto = "thin"

[patch.crates-io]
tree-sitter-language = { git = "https://github.com/tree-sitter/tree-sitter", rev = "803c6ebaac27d69e1808b45058482e868d073ceb" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
notify = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }
notify-types = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }
